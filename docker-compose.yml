# 로컬 개발용 MySQL. 운영 설정이 아니며 계정 정보도 로컬 전용이다.
# 다른 프로젝트의 MySQL과 겹치지 않도록 호스트 포트는 3307을 쓴다.
services:
  mysql:
    image: mysql:8.4
    container_name: layer7-auction-mysql
    environment:
      MYSQL_DATABASE: auction
      MYSQL_USER: auction
      MYSQL_PASSWORD: auction
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:

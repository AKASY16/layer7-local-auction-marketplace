spring:
  application:
    name: auction-api
  autoconfigure:
    # 로그인은 JWT로만 하므로, Spring Boot가 시작 로그에 임시 비밀번호를 찍으며 만드는 기본 사용자는 쓰지 않는다
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # localhost는 IPv6(::1)로 먼저 풀릴 수 있어, Docker가 연 IPv4 포트로 확실히 가도록 127.0.0.1을 쓴다
    url: jdbc:mysql://127.0.0.1:3307/auction?serverTimezone=UTC&characterEncoding=UTF-8
    # DB_PASSWORD처럼 흔한 이름은 다른 프로젝트용 환경 변수와 겹쳐 엉뚱한 값이 들어오므로 프로젝트 접두사를 붙인다
    username: ${AUCTION_DB_USERNAME:auction}
    password: ${AUCTION_DB_PASSWORD:auction}
    hikari:
      # 정합성은 비관적 락이 보장하고, 락 후 재검증이 최신 커밋을 읽도록 READ COMMITTED를 쓴다 (docs/backend/locking.md)
      transaction-isolation: TRANSACTION_READ_COMMITTED
      # 기본 50초면 인기 경매에 몰린 대기 요청이 커넥션 풀을 전부 묶는다
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

auction:
  jwt:
    secret: ${AUCTION_JWT_SECRET}

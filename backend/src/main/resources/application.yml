spring:
  application:
    name: auction-api
  datasource:
    url: jdbc:mysql://localhost:3307/auction?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:auction}
    password: ${DB_PASSWORD:auction}
    hikari:
      # 정합성은 비관적 락이 보장하고, 락 후 재검증이 최신 커밋을 읽도록 READ COMMITTED를 쓴다 (docs/backend/locking.md)
      transaction-isolation: TRANSACTION_READ_COMMITTED
      # 기본 50초면 인기 경매에 몰린 대기 요청이 커넥션 풀을 전부 묶는다
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

version: 1.0.0
classes:
  EMPIRICAL: estimated from the raw files by the scripts in statistical_analysis/
  LITERATURE: taken from one of the four papers (quoted in method)
  ASSUMED: no direct evidence; set for simulation (tuned ones say so)
params:
  price_logsd_retro_game:
    value: 1.367
    unit: log KRW
    meaning: sd of log value, retro games
    source: ebay-sold-comps retro-video-games-cib/lots
    method: lognormal MLE (AIC best of 4)
    n: 120
    market: US eBay sold listings 2026-08/09
    uncertainty: n=120; CIB and lots mixed
    class: EMPIRICAL
    transfer_to_layer7: dispersion only; level is ASSUMED
  price_logsd_figure:
    value: 0.846
    unit: log KRW
    meaning: sd of log value, figures/toys
    source: ShopGoodwill LEGO, non-lot titles
    method: lognormal MLE
    n: 213
    market: US Goodwill auctions 2026-06
    uncertainty: hotwheels eBay gives 1.03 (n=60)
    class: EMPIRICAL
    transfer_to_layer7: LEGO used as proxy for figures
  price_logsd_limited_goods:
    value: 0.894
    unit: log KRW
    meaning: sd of log value, limited goods
    source: ShopGoodwill 12 files, non-lot titles
    method: median over files of sd(log price)
    n: 2582
    market: US Goodwill auctions 2026-06..09
    uncertainty: file range 0.74-1.12
    class: EMPIRICAL
    transfer_to_layer7: category proxy
  seller_listings_nb_size:
    value: 0.398
    unit: '-'
    meaning: NB size (dispersion) of listings per seller
    source: ShopGoodwill
    method: zero-truncated NB MLE on listings per seller
    n: 144
    market: US Goodwill stores (institutional sellers)
    uncertainty: sold-only listings; stores are not C2C sellers
    class: EMPIRICAL
    transfer_to_layer7: shape only, mean set by scale
  rebid_fast_share:
    value: 0.703
    unit: share
    meaning: share of same-bidder re-bids within 10 min
    source: Jank & Shmueli 9 datasets, calibration split
    method: empirical share
    n: 3861
    market: eBay 2003 hard close
    uncertainty: split point 10 min chosen by hand
    class: EMPIRICAL
    transfer_to_layer7: ''
  rebid_fast_median_min:
    value: 0.366
    unit: min
    meaning: median delay, fast re-bid
    source: Jank & Shmueli
    method: median of gaps <= 10 min
    n: 3861
    market: eBay 2003
    uncertainty: ''
    class: EMPIRICAL
    transfer_to_layer7: ''
  rebid_fast_logsd:
    value: 0.951
    unit: log min
    meaning: log sd, fast re-bid
    source: Jank & Shmueli
    method: sd of log gap <= 10 min
    n: 3861
    market: eBay 2003
    uncertainty: ''
    class: EMPIRICAL
    transfer_to_layer7: ''
  rebid_slow_median_min:
    value: 597.7
    unit: min
    meaning: median delay, slow re-bid
    source: Jank & Shmueli
    method: median of gaps > 10 min
    n: 3861
    market: eBay 2003
    uncertainty: ''
    class: EMPIRICAL
    transfer_to_layer7: ''
  rebid_slow_logsd:
    value: 1.734
    unit: log min
    meaning: log sd, slow re-bid
    source: Jank & Shmueli
    method: sd of log gap > 10 min
    n: 3861
    market: eBay 2003
    uncertainty: ''
    class: EMPIRICAL
    transfer_to_layer7: ''
  snipe_offset_max_sec:
    value: 120
    unit: s
    meaning: snipes land uniformly in the last N seconds
    source: Shmueli, Russo & Jank 2007, Table 4 and 5.3
    method: last stage lasts ~2 min or less, alpha3 ~ 1 (uniform)
    n: 9 eBay datasets
    market: eBay hard close
    uncertainty: d2 0.5-2 min across datasets
    class: LITERATURE
    transfer_to_layer7: ''
  snipe_transmit_fail_prob:
    value: 0.045
    unit: prob
    meaning: late bid fails to register
    source: Roth & Ockenfels 2002, sec. II
    method: esnipe statistic, Sept 2000
    n: ~4,200 bids/day
    market: eBay 2000
    uncertainty: one service, one month
    class: LITERATURE
    transfer_to_layer7: ''
  snipe_unavailable_prob:
    value: 0.1
    unit: prob
    meaning: planned late bidder not available at the end
    source: Roth & Ockenfels 2002, survey
    method: median self-reported frequency
    n: survey responders
    market: eBay 2000
    uncertainty: self-report
    class: LITERATURE
    transfer_to_layer7: ''
  wtp_idio_logsd:
    value: 0.25
    unit: log
    meaning: idiosyncratic buyer-item valuation dispersion
    source: Bimpikis et al. 2020, Table 11
    method: 'idiosyncratic SD / mean valuation: MU 2978/18594=0.16, UD 4313/15459=0.28'
    n: 74 MU + 113 UD bidders
    market: B2B iPhone liquidation
    uncertainty: B2B resellers, not collectors
    class: LITERATURE
    transfer_to_layer7: ''
  buyer_daily_retention:
    value: 0.97
    unit: prob/day
    meaning: probability an active buyer stays another day

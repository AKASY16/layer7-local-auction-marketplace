    market: B2B
    uncertainty: B2B pool dynamics
    class: LITERATURE
    transfer_to_layer7: ''
  supply_peak_ratio:
    value: 1.5
    unit: ratio
    meaning: top-4-hour share of auction ends / of bids (crowded scenario)
    source: Simonsohn 2010, sec. 1 and Fig. 2
    method: 37.6% of auctions vs 25.0% of bids end/placed 5-9 pm (Pacific)
    n: 14,973 auctions, 44,735 bids
